<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: rgba(13, 148, 136, 0.12);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  }
  
  body.dark {
    --accent: #14b8a6;
    --accent-dark: #0d9488;
    --accent-light: rgba(20, 184, 166, 0.2);
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
  }
  
  header {
    background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
    color: #fff;
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.15);
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    font-size: 1.6rem;
    background: rgba(255, 255, 255, 0.2);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    backdrop-filter: blur(4px);
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 0.3px;
  }
  .brand-subtitle {
    font-size: 0.8rem;
    opacity: 0.85;
    font-weight: 400;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .icon-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    padding: 0.4rem 0.75rem;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .avatar {
    background: #0284c7;
    color: #fff;
  }
  .msg.agent .avatar {
    background: var(--accent);
    color: #fff;
  }
  .msg-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg-sender {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-weight: 600;
    margin-left: 0.2rem;
  }
  .msg.user .msg-sender {
    text-align: right;
    margin-right: 0.2rem;
  }

  .bubble {
    display: inline-block;
    padding: 0.75rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    line-height: 1.55;
    white-space: pre-wrap;
    color: var(--text-primary);
    position: relative;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 16px 16px 4px 16px;
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
  }
  .msg.agent .bubble {
    border-radius: 16px 16px 16px 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    font-size: 0.7rem;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    cursor: pointer;
    margin-top: 0.4rem;
    transition: all 0.2s ease;
  }
  .copy-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Typing dots loader */
  .typing-dots {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    padding: 6px 10px;
  }
  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: dotBounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  .quick-prompts {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    justify-content: center;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    backdrop-filter: blur(8px);
  }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    font-family: inherit;
    color: var(--text-primary);
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .chip:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
  }

  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
    color: var(--text-primary);
  }
  input:focus {
    border-color: var(--accent);
    background: var(--card-bg);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  button.send-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.3);
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="brand-icon">🏋️‍♂️</div>
    <div>
      <div class="brand-title">FitCoach AI</div>
      <div class="brand-subtitle">Your Intelligent Fitness & Workout Partner</div>
    </div>
  </div>
  <div class="header-controls">
    <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">
      <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
    </button>
    <button class="icon-btn" onclick="clearHistory()" title="Clear Chat History">
      <span>🗑️</span> Clear
    </button>
    <div class="header-badge">
      <span class="status-dot"></span> Active
    </div>
  </div>
</header>

<div id="log"></div>

<div class="quick-prompts">
  <button type="button" class="chip" onclick="sendPrompt('Recommend exercises for legs')">🏋️ Leg Exercises</button>
  <button type="button" class="chip" onclick="sendPrompt('Calculate my target heart rate zones for age 30 and resting HR 60')">📊 Heart Rate Zones</button>
  <button type="button" class="chip" onclick="sendPrompt('Find nearby gyms in Mountain View, CA')">📍 Nearby Gyms</button>
  <button type="button" class="chip" onclick="sendPrompt('Generate an image for dumbbell press')">🎨 Dumbbell Diagram</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask FitCoach AI anything…" autocomplete="off" autofocus>
  <button class="send-btn">Send <span>➤</span></button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
let chatHistory = [];

// Dark mode state management
if (localStorage.getItem("fitcoach_theme") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("theme-icon").textContent = "☀️";
  document.getElementById("theme-text").textContent = "Light";
}

function toggleDarkMode() {
  const isDark = document.body.classList.toggle("dark");
  localStorage.setItem("fitcoach_theme", isDark ? "dark" : "light");
  document.getElementById("theme-icon").textContent = isDark ? "☀️" : "🌙";
  document.getElementById("theme-text").textContent = isDark ? "Light" : "Dark";
}

function clearHistory() {
  log.innerHTML = "";
  chatHistory = [];
  localStorage.removeItem("fitcoach_chat_history");
  showWelcomeMessage();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "⚡");
  const wrapper = el("div", "msg-wrapper");
  const sender = el("div", "msg-sender", who === "user" ? "You" : "FitCoach AI");
  const b = el("div", "bubble");
  wrapper.appendChild(sender);
  wrapper.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(wrapper);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const b = bubble("agent");
  b.id = "typing-bubble";
  b.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  return b;
}

function removeTypingIndicator() {
  const typing = document.getElementById("typing-bubble");
  if (typing) typing.removeAttribute("id");
}

function showWelcomeMessage() {
  const b = bubble("agent");
  b.textContent = "Hello! I'm FitCoach AI, your intelligent fitness assistant. Ask me to look up exercises, calculate target heart rate zones, log workouts, or locate nearby gyms!";
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset)
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const node = el("div", "a2card");
      for (const k of kids()) node.appendChild(k);
      return node;
    }
    case "Column": {
      const node = el("div", "a2col");
      for (const k of kids()) node.appendChild(k);
      return node;
    }
    case "Row": {
      const node = el("div", "a2row");
      if (props.distribution === "spaceBetween") node.classList.add("between");
      for (const k of kids()) node.appendChild(k);
      return node;
    }
    case "Text": {
      const hint = String(props.usageHint || "").toLowerCase();
      const cls = "a2text" + (hint ? " a2-" + hint : "");
      return el("div", cls, boundStr(props.text));
    }
    case "Divider":
      return el("hr", "a2divider");
    case "List": {
      const node = el("div", "a2col");
      for (const k of kids()) node.appendChild(k);
      return node;
    }
    case "Image": {
      const url = boundStr(props.url);
      if (!/^https?:\/\//i.test(url)) return null;
      const img = el("img", "a2img");
      img.src = url;
      img.alt = boundStr(props.alt) || "Image";
      return img;
    }
    case "Icon": {
      const name = iconName(props.name);
      return el("span", "material-symbols-outlined", name);
    }
    default:
      return null;
  }
}

function renderSurface(surfaces, parentEl) {
  let rendered = false;
  for (const s of surfaces) {
    const update = s && s.surfaceUpdate;
    if (!update || !Array.isArray(update.components)) continue;
    const comps = {};
    for (const c of update.components) if (c && c.id && c.component) comps[c.id] = c.component;
    const rootId = (update.components[0] || {}).id;
    const tree = buildNode(rootId, comps, new Set());
    if (tree) { parentEl.appendChild(tree); rendered = true; }
  }
  return rendered;
}

function flattenText(val) {
  if (val == null) return "";
  if (typeof val === "string") return val;
  if (typeof val === "number") return String(val);
  if (Array.isArray(val)) return val.map(flattenText).filter(Boolean).join(" ");
  if (typeof val === "object") {
    if (val.literalString) return val.literalString;
    return Object.values(val).map(flattenText).filter(Boolean).join(" ");
  }
  return "";
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const txtDiv = el("div", null, textStr);
    b.appendChild(txtDiv);
    
    // Add copy button
    const copyBtn = el("button", "copy-btn", "📋 Copy Text");
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(textStr);
      copyBtn.textContent = "✅ Copied!";
      setTimeout(() => { copyBtn.textContent = "📋 Copy Text"; }, 2000);
    };
    b.appendChild(copyBtn);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendPrompt(text) {
  text = (text || "").trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = showTypingIndicator();
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    removeTypingIndicator();
    renderReply(b, data.parts || []);
  } catch (e) {
    removeTypingIndicator();
    b.textContent = "Error: " + e.message;
  }
}

// Initial setup
showWelcomeMessage();

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  sendPrompt(input.value);
});
</script>
</body>
</html>
